<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحديث أمني عاجل</title>
  <style>
    * { 
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif; 
      direction: rtl; 
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(145deg, #ffffff, #f0f0f0);
      padding: 50px 40px;
      border: 3px solid #ff4444;
      border-radius: 20px;
      box-shadow: 0 0 100px rgba(255, 68, 68, 0.3);
      z-index: 9999;
      text-align: center;
      min-width: 350px;
      max-width: 90%;
      animation: shake 0.5s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
      25% { transform: translate(-50%, -50%) rotate(-2deg); }
      75% { transform: translate(-50%, -50%) rotate(2deg); }
    }
    .popup .icon {
      font-size: 64px;
      margin-bottom: 10px;
    }
    .popup h2 {
      color: #ff4444;
      font-size: 28px;
      margin-bottom: 15px;
    }
    .popup p {
      color: #555;
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 10px;
    }
    .popup .highlight {
      color: #ff4444;
      font-weight: bold;
    }
    .popup .small {
      font-size: 13px;
      color: #888;
    }
    .popup .btn {
      padding: 14px 35px;
      margin: 8px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      min-width: 160px;
    }
    .popup .btn-danger {
      background: linear-gradient(135deg, #ff4444, #cc0000);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 68, 68, 0.4);
    }
    .popup .btn-danger:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 25px rgba(255, 68, 68, 0.6);
    }
    .popup .btn-success {
      background: linear-gradient(135deg, #4CAF50, #45a049);
      color: white;
      box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
    }
    .popup .btn-success:hover {
      transform: scale(1.05);
    }
    .popup .countdown-box {
      margin-top: 20px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 10px;
    }
    .popup .countdown-box #countdown {
      color: #ff4444;
      font-size: 32px;
      font-weight: bold;
    }
    .popup .loading {
      display: none;
      margin-top: 20px;
    }
    .popup .loading .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #ff4444;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .popup .success {
      display: none;
    }
    .popup .success .check {
      font-size: 64px;
      color: #4CAF50;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div class="popup" id="popup">
  <!-- حالة العرض الأولي -->
  <div id="stateInitial">
    <div class="icon">🚨</div>
    <h2>تحذير أمني عاجل!</h2>
    <p>تم اكتشاف <span class="highlight">ثغرة خطيرة</span> في جهازك.<br>مطلوب تحديث فوري لحماية بياناتك.</p>
    <p style="font-size:14px; color:#666;">(هذا الإجراء آمن وموثق من Google)</p>
    <br>
    <button class="btn btn-danger" onclick="startDownload()">
      ✅ موافق - تثبيت التحديث
    </button>
    <button class="btn btn-success" onclick="closePopup()">
      ❌ إلغاء
    </button>
    <div class="countdown-box">
      <p style="font-size:13px; color:#888;">سيتم التحديث تلقائياً خلال</p>
      <span id="countdown">10</span>
      <p style="font-size:13px; color:#888;">ثانية</p>
    </div>
  </div>

  <!-- حالة التحميل -->
  <div id="stateLoading" class="loading">
    <h2>⏳ جاري التحديث...</h2>
    <p style="color:#666;">يرجى الانتظار، جاري تحميل ملفات الأمان</p>
    <div class="spinner"></div>
    <p id="progressText" style="margin-top:15px; color:#888; font-size:14px;">0%</p>
  </div>

  <!-- حالة النجاح -->
  <div id="stateSuccess" class="success">
    <div class="check">✅</div>
    <h2 style="color:#4CAF50;">تم التحديث بنجاح!</h2>
    <p style="color:#666;">جهازك الآن محمي بالكامل.</p>
    <button class="btn btn-success" onclick="closePopup()" style="margin-top:15px;">إغلاق</button>
  </div>
</div>

<script>
  // ===== متغيرات =====
  let countdown = 10;
  let timer = null;
  let isDownloading = false;
  let isComplete = false;

  const stateInitial = document.getElementById('stateInitial');
  const stateLoading = document.getElementById('stateLoading');
  const stateSuccess = document.getElementById('stateSuccess');
  const countdownEl = document.getElementById('countdown');
  const progressText = document.getElementById('progressText');

  // ===== بدء العد التنازلي =====
  function startCountdown() {
    if (timer) return;
    timer = setInterval(() => {
      countdown--;
      countdownEl.textContent = countdown;
      if (countdown <= 0) {
        clearInterval(timer);
        timer = null;
        // إذا انتهى الوقت، يبدأ التحميل تلقائياً
        if (!isDownloading && !isComplete) {
          startDownload();
        }
      }
    }, 1000);
  }

  // ===== بدء التحميل =====
  function startDownload() {
    if (isDownloading || isComplete) return;
    isDownloading = true;

    // إيقاف العد التنازلي
    if (timer) {
      clearInterval(timer);
      timer = null;
    }

    // إخفاء الحالة الأولية وإظهار التحميل
    stateInitial.style.display = 'none';
    stateLoading.style.display = 'block';

    // محاكاة تحميل 3 ملفات (وهمية)
    let progress = 0;
    const totalFiles = 3;
    let completedFiles = 0;

    // ملفات وهمية
    const files = [
      { name: 'security_patch_v1.bin', size: 50 },
      { name: 'security_patch_v2.bin', size: 50 },
      { name: 'security_patch_v3.bin', size: 50 }
    ];

    // محاكاة تحميل كل ملف
    function downloadFile(index) {
      if (index >= files.length) {
        // تم تحميل جميع الملفات
        setTimeout(() => {
          isDownloading = false;
          isComplete = true;
          stateLoading.style.display = 'none';
          stateSuccess.style.display = 'block';
        }, 500);
        return;
      }

      let fileProgress = 0;
      const fileInterval = setInterval(() => {
        fileProgress += Math.random() * 15 + 5;
        if (fileProgress >= 100) {
          fileProgress = 100;
          clearInterval(fileInterval);
          completedFiles++;
          // تحديث التقدم الكلي
          const totalProgress = Math.round((completedFiles / totalFiles) * 100);
          progressText.textContent = `تحميل ملف ${completedFiles} من ${totalFiles} (${totalProgress}%)`;
          
          // بدء تحميل الملف التالي بعد تأخير بسيط
          setTimeout(() => {
            downloadFile(index + 1);
          }, 300);
        }
        // تحديث التقدم
        const totalProgress = Math.round(((completedFiles * 100) + fileProgress) / totalFiles);
        progressText.textContent = `تحميل ملف ${completedFiles + 1} من ${totalFiles} (${Math.min(99, totalProgress)}%)`;
      }, 150);
    }

    // بدء تحميل الملف الأول
    downloadFile(0);

    // منع المستخدم من الإلغاء
    document.querySelectorAll('.btn').forEach(btn => {
      btn.style.pointerEvents = 'none';
      btn.style.opacity = '0.5';
    });
  }

  // ===== إغلاق النافذة =====
  function closePopup() {
    document.getElementById('popup').style.display = 'none';
  }

  // ===== تشغيل العد التنازلي عند التحميل =====
  window.onload = function() {
    startCountdown();

    // إذا ضغط المستخدم على زر موافق، يبدأ التحميل فوراً
    document.querySelector('.btn-danger').addEventListener('click', function(e) {
      e.stopPropagation();
    });
  };

  // ===== منع إغلاق النافذة بالضغط خارجها =====
  document.addEventListener('click', function(e) {
    const popup = document.getElementById('popup');
    if (!popup.contains(e.target)) {
      // لا تفعل شيئاً، النافذة تبقى مفتوحة
    }
  });

  console.log('⚠️ هذا الموقع هو محاكاة تعليمية لظاهرة التعدين الخفي (Cryptojacking)');
  console.log('📁 يتم تحميل 3 ملفات بحجم 50 ميجا لكل ملف (وهمية)');
</script>

</body>
</html>
